
[theme]
base = "dark"
font = "sans serif"

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"

[theme.dark]
primaryColor = "#3B82F6"
backgroundColor = "#0A1628"
secondaryBackgroundColor = "#111E35"
textColor = "#F1F5F9"
borderColor = "#1E3A5F"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
primaryColor = "#2563EB"

[theme.dark.sidebar]
backgroundColor = "#0D1F3C"
secondaryBackgroundColor = "#162544"
textColor = "#F1F5F9"
primaryColor = "#3B82F6"
